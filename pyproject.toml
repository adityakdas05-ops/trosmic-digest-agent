[project]
name = "trosmic-digest-agent"
version = "0.1.0"
description = "Local-first digest agent for collecting, deduplicating, scoring, and rendering source updates."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Trosmic" }
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
band = [
  "thenvoi-sdk[langgraph]",
  "openai",
  "pyyaml",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "ruff",
]

[project.scripts]
trosmic-digest = "trosmic_digest_agent.main:main"
trosmic-digest-scheduler = "trosmic_digest_agent.scheduler:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trosmic_digest_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/trosmic_digest_agent/renderers.py" = ["E501"]
"src/trosmic_digest_agent/trosmic_policy.py" = ["E501"]
