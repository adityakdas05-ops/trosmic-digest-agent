[project]
name = "trosmic-digest-agent"
version = "0.1.0"
description = "Local-first digest agent for collecting, deduplicating, scoring, and rendering source updates."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Trosmic" }
]
dependencies = []

[project.optional-dependencies]
band = [
  "thenvoi",
  "langchain-openai",
  "langgraph",
  "openai",
  "pyyaml",
]
dev = [
  "ruff",
]

[project.scripts]
trosmic-digest = "trosmic_digest_agent.main:main"
trosmic-digest-scheduler = "trosmic_digest_agent.scheduler:main"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
